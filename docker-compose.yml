version: '3.9'

services:
  autoreport:
    container_name: autoreport
    build:
      context: .
      dockerfile: Dockerfile
    image: autoreport:latest
    ports:
      - "8531:8501"
    volumes:
      - .:/app
      - ./output:/app/output
      - ./.secretcontainer:/app/.secretcontainer
    restart: unless-stopped
    pull_policy: never